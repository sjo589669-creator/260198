<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Flex 가운데 정렬 연습</title>
    <style>
      /* CSS: 부모에게 flex 지시 */
      .container {
        display: flex;
        justify-content: center;
        gap: 12px;
      }

      /* 박스 모양이 잘 보이도록 추가한 스타일 */
      .container div {
        padding: 20px;
        border: 1px solid gray;
        background-color: lightyellow;
      }
    </style>
  </head>
  <body>
    <!-- HTML: 박스 3개를 감싸는 부모 -->
    <div class="container">
      <div>박스1</div>
      <div>박스2</div>
      <div>박스3</div>
    </div>
  </body>
</html>
